server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Text assets shrink to about a third. Chat streams are left alone: gzip would hold tokens back.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # SSE: send tokens to the browser as they arrive.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
  }

  # nginx drops inherited add_header lines inside a block that sets its own, so they repeat here.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }
}
